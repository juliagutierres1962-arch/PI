<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Ju & Jhe Beauty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <!-- MENU -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#menu"
                aria-controls="menu"
                aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand" href="index.html">
                JU & JHE BEAUTY
            </a>
            <div class="offcanvas offcanvas-end" tabindex="-1"
                id="menu" aria-labelledby="tituloMenu">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="tituloMenu">
                        Menu
                    </h5>
                    <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="offcanvas"
                        aria-label="Fechar">
                    </button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="sobrenos.html">Sobre nós</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="produtos.html">Produtos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="cadastro.html">Cadastro</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="carrinho.html">Carrinho</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="pagamento.html">Pagamento</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    <!-- CABEÇALHO -->
    <header class="cabecalho">
        <img src="./img/7.png" alt="Ju & Jhe Beauty">
    </header>
    <!-- CADASTRO -->
    <main class="pagina-cadastro">
        <section class="caixa-cadastro">
            <h1>Crie sua conta</h1>
            <p class="texto-cadastro">
                Cadastre-se na Ju & Jhe Beauty e fique por dentro das novidades!
            </p>
            <form action="#" method="post">
                <div class="campo-cadastro">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome"
                        placeholder="Digite seu nome completo" required>
                </div>
                <div class="campo-cadastro">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email"
                        placeholder="Digite seu e-mail" required>
                </div>
                <div class="campo-cadastro">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone"
                        placeholder="(00) 00000-0000" required>
                </div>
                <div class="campo-cadastro">
                    <label for="nascimento">Data de nascimento</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>
                <div class="campo-cadastro">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha"
                        placeholder="Crie uma senha" required>
                </div>
                <div class="campo-cadastro">
                    <label for="confirmar">Confirmar senha</label>
                    <input type="password" id="confirmar" name="confirmar"
                        placeholder="Digite a senha novamente" required>
                </div>
                <button type="submit" class="botao-cadastro">
                    Criar minha conta
                </button>
                <p class="texto-login">
                    Já tem uma conta?
                    <a href="login.html">Faça login</a>
                </p>
            </form>
        </section>
    </main>
    <!-- RODAPÉ -->
    <footer class="rodape">
        <img src="./img/6.png" alt="Ju & Jhe Beauty">
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
